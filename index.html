<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rigatoni's Invitation</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#fdf8f6',
              100: '#f2e8e5',
              400: '#e08369',
              500: '#d96343',
              600: '#c24828',
              900: '#1e1614',
            }
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0d0e12;
      color: #f3f4f6;
    }
    
    @keyframes tailWag {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(18deg); }
    }
    .animate-wag {
      transform-origin: 15% 80%;
      animation: tailWag 0.35s ease-in-out infinite;
    }

    .blackout-pattern {
      background-image: repeating-linear-gradient(
        135deg,
        rgba(239, 68, 68, 0.15),
        rgba(239, 68, 68, 0.15) 6px,
        rgba(31, 41, 55, 0.6) 6px,
        rgba(31, 41, 55, 0.6) 12px
      );
    }

    .toast-animate {
      animation: toastIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes toastIn {
      from { opacity: 0; transform: translate(-50%, 12px) scale(0.95); }
      to { opacity: 1; transform: translate(-50%, 0) scale(1); }
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 selection:bg-rose-500 selection:text-white">

  <!-- Main Container Card -->
  <main class="w-full max-w-lg bg-gray-900/90 border border-gray-800 backdrop-blur-xl rounded-3xl shadow-2xl overflow-hidden transition-all duration-300 relative">
    
    <!-- Top Navigation Header -->
    <header class="p-5 sm:p-6 pb-0 flex items-center justify-between border-b border-gray-800
